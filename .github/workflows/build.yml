name: Build Electron Windows app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: RobloxDuo-electron-windows
          path: dist/RobloxDuo-win32-x64/
          retention-days: 14
